<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="story:duration" content="4.6">
  <meta name="story:poster" content="3.6">
  <link rel="stylesheet" href="/runtime/story.css">
  <link rel="stylesheet" href="../theme.css">
  <script src="/runtime/story.js"></script>
  <style>
    h1 {
      position: absolute;
      top: 64px;
      left: 0;
      right: 0;
      margin: 0;
      text-align: center;
      font-size: 92px;
      font-weight: 650;
      letter-spacing: -0.05em;
    }
    h1 em { font-family: var(--font-serif); font-weight: 400; font-size: 1.12em; letter-spacing: -0.02em; }

    .camera {
      position: absolute;
      left: 0;
      top: 150px;
      width: 1920px;
      height: 930px;
      perspective: 3200px;
      perspective-origin: 50% 30%;
    }
    .stack {
      position: absolute;
      left: 320px;
      top: 70px;
      width: 1280px;
      height: 800px;
      transform-style: preserve-3d;
    }
    .layer {
      position: absolute;
      transform-style: preserve-3d;
      border-radius: 14px;
      background: #fff;
      box-shadow: 0 0 0 1.5px rgb(0 0 0 / 0.07), 0 18px 40px -18px rgb(0 0 0 / 0.22);
    }
    .anchor { position: absolute; width: 2px; height: 2px; }

    /* Window chrome, from TopBar.svelte */
    .base { inset: 0; border-radius: 22px; background: #f4f4f4; overflow: hidden; }
    .topbar {
      display: flex;
      align-items: center;
      gap: 12px;
      height: 56px;
      padding: 0 18px;
      background: #fff;
      border-bottom: 1.5px solid #e5e5e5;
      font-size: 15px;
      font-weight: 600;
    }
    .logo { width: 24px; height: 24px; border-radius: 7px; background: #111; }
    .pill { height: 30px; border-radius: 8px; border: 1.5px solid #e5e5e5; padding: 0 12px; display: flex; align-items: center; font-weight: 500; color: #404040; }
    .tabs { display: flex; padding: 3px; border-radius: 9px; background: #f0f0f0; font-weight: 500; color: #888; }
    .tabs span { padding: 4px 12px; border-radius: 6px; }
    .tabs span:first-child { background: #fff; color: #111; box-shadow: 0 1px 2px rgb(0 0 0 / 0.08); }
    .present { margin-left: auto; height: 32px; padding: 0 14px; border-radius: 8px; background: #111; color: #fff; display: flex; align-items: center; }

    /* Preview, from Stage.svelte */
    .stage { left: 24px; top: 84px; width: 830px; height: 467px; overflow: hidden; }
    .stage .mini-title { position: absolute; top: 46px; width: 100%; text-align: center; font-size: 46px; font-weight: 650; letter-spacing: -0.05em; }
    .stage .mini-card {
      position: absolute; left: 270px; top: 150px; width: 290px; height: 230px; border-radius: 12px; background: #fff;
      box-shadow: 0 0 0 1px #e5e5e5, 0 14px 30px -12px rgb(0 0 0 / 0.2);
      transform: rotateX(30deg) rotateZ(-14deg);
    }
    .mini-card i { position: absolute; left: 22px; right: 22px; height: 14px; border-radius: 4px; background: #f0f0f0; }

    /* Transport.svelte */
    .transport { left: 24px; top: 568px; width: 830px; height: 52px; display: flex; align-items: center; gap: 14px; padding: 0 14px; }
    .seg { display: flex; padding: 3px; border-radius: 8px; background: #f0f0f0; font-size: 12px; font-weight: 600; color: #888; }
    .seg span { padding: 4px 9px; border-radius: 6px; }
    .seg span:first-child { background: #111; color: #fff; }
    .play { width: 32px; height: 32px; border-radius: 50%; background: #111; }
    .time { font: 500 14px var(--font-mono); }
    .track { position: relative; flex: 1; height: 3px; border-radius: 3px; background: #e5e5e5; }
    .track b { position: absolute; left: 0; top: 0; bottom: 0; width: 66%; background: #222; border-radius: 3px; }
    .track u { position: absolute; left: 66%; top: -8px; width: 5px; height: 19px; border-radius: 3px; background: var(--playhead); margin-left: -2px; box-shadow: 0 0 0 2px #fff; }

    /* ChatPanel.svelte */
    .chat { left: 874px; top: 74px; width: 382px; height: 546px; padding: 18px; }
    .chat .head { display: flex; gap: 8px; align-items: center; font-size: 15px; font-weight: 650; margin-bottom: 18px; }
    .chat .head span { padding: 3px 9px; border-radius: 6px; background: #f0f0f0; font-size: 12px; font-weight: 600; color: #555; }
    .bubble { border-radius: 14px; background: #f4f4f4; padding: 14px; margin-bottom: 12px; }
    .bubble i { display: block; height: 9px; border-radius: 4px; background: #dcdcdc; margin: 7px 0; }
    .bubble.user { margin-left: 70px; background: #111; }
    .bubble.user i { background: #555; }
    .composer { position: absolute; left: 18px; right: 18px; bottom: 18px; height: 92px; border-radius: 12px; border: 1.5px solid #e5e5e5; }
    .composer b { position: absolute; right: 10px; bottom: 10px; width: 62px; height: 28px; border-radius: 8px; background: #111; }

    /* Filmstrip.svelte */
    .film { left: 24px; top: 640px; width: 1232px; height: 140px; display: flex; gap: 14px; padding: 16px; }
    .thumb { width: 196px; height: 108px; border-radius: 9px; background: linear-gradient(160deg, #fff 30%, #ececec); box-shadow: 0 0 0 1.5px #e5e5e5; }
    .thumb.on { box-shadow: 0 0 0 2.5px var(--playhead), 0 0 0 5px #fff, 0 0 0 6px #ddd; }

    .label {
      position: absolute;
      font-size: 27px;
      font-weight: 550;
      letter-spacing: -0.02em;
      white-space: nowrap;
      color: #262626;
    }
    .label small { display: block; font-size: 19px; font-weight: 450; color: var(--muted); letter-spacing: -0.01em; }
    svg.lines { position: absolute; inset: 0; overflow: visible; pointer-events: none; }
    svg.lines path { fill: none; stroke: #171717; stroke-width: 1.6; }
    svg.lines circle { fill: #fff; stroke: #171717; stroke-width: 1.8; }
  </style>
</head>
<body>
  <h1>Every piece, <em>in its place</em></h1>

  <div class="camera">
    <div class="stack">
      <div class="layer base">
        <div class="topbar">
          <span class="logo"></span>Storyboard
          <span class="pill">Example: Storyboard teaser</span>
          <span class="tabs"><span>Scenes</span><span>Render</span></span>
          <span class="present">Present</span>
        </div>
      </div>
      <div class="layer film">
        <div class="thumb"></div><div class="thumb on"></div><div class="thumb"></div><div class="thumb"></div><div class="thumb"></div>
        <i class="anchor" data-k="film" style="left: 640px; top: 128px"></i>
      </div>
      <div class="layer transport">
        <div class="seg"><span>This scene</span><span>Whole video</span></div>
        <div class="play"></div>
        <div class="time">2.22 / 3.32s</div>
        <div class="track"><b></b><u></u></div>
        <i class="anchor" data-k="transport" style="left: 0; top: 26px"></i>
      </div>
      <div class="layer stage">
        <div class="mini-title">Every part in its place</div>
        <div class="mini-card"><i style="top:30px"></i><i style="top:62px;right:90px"></i><i style="top:110px"></i><i style="top:142px;right:60px"></i></div>
        <i class="anchor" data-k="stage" style="left: 0; top: 120px"></i>
      </div>
      <div class="layer chat">
        <div class="head">Anatomy <span>Scene</span></div>
        <div class="bubble user"><i></i><i style="width:60%"></i></div>
        <div class="bubble"><i></i><i></i><i style="width:80%"></i><i></i><i style="width:45%"></i></div>
        <div class="bubble"><i></i><i style="width:70%"></i></div>
        <div class="composer"><b></b></div>
        <i class="anchor" data-k="chat" style="left: 382px; top: 250px"></i>
      </div>
    </div>
  </div>

  <svg class="lines" width="1920" height="1080"></svg>
  <div class="label left" data-k="stage" style="left: 330px; top: 410px">Live preview<small>Seek to any frame</small></div>
  <div class="label right" data-k="chat" style="left: 1560px; top: 420px">Claude<small>Reads your codebase</small></div>
  <div class="label left" data-k="transport" style="left: 300px; top: 700px">Timeline<small>Beats from your music</small></div>
  <div class="label right" data-k="film" style="left: 1450px; top: 930px">Scenes<small>Drag to reorder</small></div>

  <script>
    Story.scene((tl, { gsap, $, $$ }) => {
      const ns = 'http://www.w3.org/2000/svg';
      const svg = $('svg.lines');
      const callouts = $$('.label').map((label) => {
        const key = label.dataset.k;
        const path = svg.appendChild(document.createElementNS(ns, 'path'));
        const dot = svg.appendChild(document.createElementNS(ns, 'circle'));
        const left = label.classList.contains('left');
        gsap.set(label, { xPercent: left ? -100 : 0, yPercent: -50 });
        return { key, label, path, dot, left, x: parseFloat(label.style.left), y: parseFloat(label.style.top), anchor: $(`.anchor[data-k="${key}"]`), p: 0 };
      });

      Story.onFrame(() => {
        for (const c of callouts) {
          const r = c.anchor.getBoundingClientRect();
          const ax = r.left + r.width / 2;
          const ay = r.top + r.height / 2;
          const end = c.left ? c.x + 22 : c.x - 22;
          const elbow = c.left ? end + 70 : end - 70;
          c.path.setAttribute('d', `M${ax.toFixed(1)},${ay.toFixed(1)} L${elbow},${c.y} L${end},${c.y}`);
          const len = c.path.getTotalLength();
          c.path.style.strokeDasharray = `${len}`;
          c.path.style.strokeDashoffset = `${len * (1 - c.p)}`;
          c.path.style.opacity = c.p > 0 ? 1 : 0;
          c.dot.setAttribute('cx', ax);
          c.dot.setAttribute('cy', ay);
          c.dot.setAttribute('r', (5.5 * Math.min(1, c.p * 5)).toFixed(2));
        }
      });

      const words = new SplitText('h1', { type: 'words' }).words;
      tl.from(words, { y: 50, opacity: 0, filter: 'blur(14px)', duration: 0.9, ease: 'expo.out', stagger: 0.08 }, 0.08);

      gsap.set('.stack', { rotateX: 0, rotateZ: 0, scale: 0.6, transformOrigin: '50% 50%' });
      tl.from('.camera', { opacity: 0, duration: 0.5, ease: 'power1.out' }, 0);
      tl.from('.stack', { y: 140, duration: 1.0, ease: 'expo.out' }, 0);
      tl.to('.stack', { rotateX: 54, rotateZ: -34, scale: 0.6, y: 95, duration: 1.25, ease: 'power3.inOut' }, 0.5);
      tl.to('.stack', { rotateZ: -30, duration: 2.85, ease: 'none' }, 1.75);

      const lift = { '.film': 70, '.transport': 140, '.stage': 220, '.chat': 300 };
      Object.entries(lift).forEach(([sel, z], i) => {
        tl.to(sel, { z, duration: 1.0, ease: 'power3.inOut' }, 1.2 + i * 0.07);
      });

      callouts.forEach((c, i) => {
        const at = 1.95 + i * 0.12;
        tl.to(c, { p: 1, duration: 0.7, ease: 'power2.inOut' }, at);
        tl.from(c.label, { opacity: 0, x: c.left ? 16 : -16, filter: 'blur(6px)', duration: 0.6, ease: 'expo.out' }, at + 0.35);
      });
    });
  </script>
</body>
</html>
