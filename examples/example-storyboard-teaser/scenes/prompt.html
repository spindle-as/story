<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="story:duration" content="4.4">
  <meta name="story:poster" content="2.4">
  <link rel="stylesheet" href="/runtime/story.css">
  <link rel="stylesheet" href="../theme.css">
  <script src="/runtime/story.js"></script>
  <style>
    body { display: grid; place-items: center; }

    .wrap { width: 1340px; }

    /* Recreated from src/components/Composer.svelte at ~2.6× scale. */
    .crumb {
      display: flex;
      align-items: center;
      gap: 14px;
      margin: 0 0 26px 6px;
      font-size: 26px;
      color: var(--muted);
    }
    .crumb b { color: var(--fg); font-weight: 600; }
    .crumb .chip {
      width: 72px;
      height: 40px;
      border-radius: 8px;
      background: linear-gradient(135deg, #fff, #ececec);
      box-shadow: 0 0 0 2px var(--playhead), 0 0 0 5px #fff, 0 0 0 6px #e5e5e5;
      display: grid;
      place-items: center;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #111;
    }

    .card {
      position: relative;
      background: #fff;
      border: 2px solid #e5e5e5;
      border-radius: 30px;
      box-shadow: 0 1px 2px rgb(0 0 0 / 0.04), 0 30px 80px -30px rgb(0 0 0 / 0.25);
      padding: 38px 40px 28px;
    }
    .field { position: relative; min-height: 210px; }
    .text, .placeholder {
      font-size: 52px;
      line-height: 1.34;
      letter-spacing: -0.022em;
    }
    .text { color: #171717; }
    .placeholder { position: absolute; inset: 0; color: #a3a3a3; }

    .row {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-top: 26px;
      font-size: 24px;
      color: #a3a3a3;
    }
    .row svg { width: 36px; height: 36px; }
    .send {
      margin-left: auto;
      padding: 16px 34px;
      border-radius: 18px;
      background: #0a0a0a;
      color: #fff;
      font-size: 27px;
      font-weight: 600;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 16px;
      width: fit-content;
      margin: 30px auto 0;
      padding: 16px 26px;
      border-radius: 999px;
      background: #f5f5f5;
      font-size: 25px;
      font-weight: 500;
      color: #404040;
    }
    .status code { font-family: var(--font-mono); font-size: 22px; color: #737373; }
    .spinner {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 3px solid #d4d4d4;
      border-top-color: #262626;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="crumb"><span class="chip">Every part</span><b>Scene 3</b> · Anatomy</div>
    <div class="card">
      <div class="field">
        <div class="placeholder">What should change?</div>
        <div class="text"></div>
      </div>
      <div class="row">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M16 5h6"/><path d="M19 2v6"/><path d="M21 11.5V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7.5"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/><circle cx="9" cy="9" r="2"/></svg>
        <span>⌘↵ to send</span>
        <span class="send">Send</span>
      </div>
    </div>
    <div class="status"><span class="spinner"></span>Claude is editing <code>scenes/anatomy.html</code></div>
  </div>
  <script>
    Story.scene((tl, { gsap }) => {
      // Measure before any entrance offsets are applied.
      const send = Story.point('.send');
      const cursor = Story.cursor({ x: 1560, y: 980, size: 40 });

      tl.from('.crumb', { y: 24, opacity: 0, filter: 'blur(8px)', duration: 0.8, ease: 'expo.out' }, 0.05);
      tl.from('.card', { y: 70, opacity: 0, scale: 0.97, filter: 'blur(10px)', duration: 1.0, ease: 'expo.out' }, 0.1);

      tl.to('.placeholder', { opacity: 0, duration: 0.15, ease: 'none' }, 0.72);
      tl.add(Story.type('.text', 'Hold on the headline a full second longer, then slide the card in from the right.', { duration: 1.9, caret: true }), 0.75);

      gsap.set(cursor.el, { opacity: 0 });
      tl.add(cursor.show({ duration: 0.2 }), 2.45);
      tl.add(cursor.moveTo(send, { dx: 10, dy: 6, duration: 0.7, ease: 'power3.inOut' }), 2.5);
      tl.add(cursor.click(), 3.22);
      tl.to('.send', { scale: 0.93, duration: 0.09, ease: 'power2.out' }, 3.22);
      tl.to('.send', { scale: 1, duration: 0.2, ease: 'power2.out' }, 3.31);
      tl.to('.text', { opacity: 0.35, duration: 0.25 }, 3.32);
      tl.add(cursor.hide({ duration: 0.3 }), 3.6);

      tl.from('.status', { y: 18, opacity: 0, scale: 0.94, filter: 'blur(6px)', duration: 0.6, ease: 'expo.out' }, 3.38);
    });
  </script>
</body>
</html>
